on:
  push:
    # Sequence of patterns matched against refs/tags
    tags:
      - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10

name: Create Release And Upload assets

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Get version
        id: get_version
        run: |
          TAG=$(basename ${GITHUB_REF})
          echo "::set-output name=TAG::$TAG"
      - name: Create Release
        id: create_release
        uses: release-drafter/release-drafter@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          config-name: release-config.yml
          version: ${{ steps.get_version.outputs.TAG }}
          tag: ${{ steps.get_version.outputs.TAG }}
          disable-releaser: true
      - uses: actions/setup-node@v2
        with:
          node-version: '20.15'
      - name: Install dependencies
        run: yarn install
      - name: Build web
        run: |
          sed -i "s@version =.*;@version = '${{ steps.get_version.outputs.TAG }}';@g" src/environments/environment.prod.ts
          yarn build
      - name: Create Upload Assets
        run: |
          mkdir -p build
          rm -rf build/*
          cp -R src/assets/i18n dist/luna/
          mv dist/luna luna-${{ steps.get_version.outputs.TAG }}
          tar -czf luna-${{ steps.get_version.outputs.TAG }}.tar.gz luna-${{ steps.get_version.outputs.TAG }}
          echo $(md5sum luna-${{ steps.get_version.outputs.TAG }}.tar.gz | awk '{print $1}') > build/luna-${{ steps.get_version.outputs.TAG }}.tar.gz.md5
          mv luna-${{ steps.get_version.outputs.TAG }}.tar.gz build/
      - name: Clean up any existing release for this tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.get_version.outputs.TAG }}"
          gh api "repos/${{ github.repository }}/releases?per_page=100" --jq \
            ".[] | select(.tag_name == \"${TAG}\") | .id" \
          | while read -r id; do
              gh api -X DELETE "repos/${{ github.repository }}/releases/${id}" && echo "Deleted existing release ${id} for ${TAG}"
            done

      - name: Release Upload Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          draft: false
          prerelease: ${{ !endsWith(steps.get_version.outputs.TAG, '-stable') }}
          make_latest: ${{ endsWith(steps.get_version.outputs.TAG, '-stable') }}
          name: ${{ steps.get_version.outputs.TAG }}
          body: ${{ steps.create_release.outputs.body }}
          files: |
            build/luna-${{ steps.get_version.outputs.TAG }}.tar.gz
            build/luna-${{ steps.get_version.outputs.TAG }}.tar.gz.md5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
