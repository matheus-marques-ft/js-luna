name: Release

# Two jobs, two triggers, one file:
#   - `tag`   fires on every push to dev (skipping this workflow's own bot
#     commits) - computes the next vX.Y.Z from js-jumpserver's tags (the
#     canonical source), tags this repo, and propagates the same tag to all
#     9 siblings so the whole fork stays on one synchronized version.
#   - `image` fires only via workflow_dispatch, from js-lina's `image` job
#     once IT has finished publishing. js-docker-web's Dockerfile mounts
#     both lina and luna from GHCR at the same tag - chaining
#     lina -> luna -> docker-web instead of building all three off the
#     propagated tag in parallel guarantees luna is fully published before
#     docker-web ever starts.
on:
  push:
    branches:
      - dev
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to build (set automatically by js-lina)'
        required: true

jobs:
  tag:
    if: github.ref == 'refs/heads/dev' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT }}

      - name: Compute next version (js-jumpserver is the canonical source)
        id: version
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          LAST_TAG=$(gh api repos/matheus-marques-ft/js-jumpserver/tags --paginate --jq '.[].name' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1)
          if [ -z "$LAST_TAG" ]; then
            NEW_TAG="v0.1.1"
          else
            VERSION=${LAST_TAG#v}
            MAJOR=$(echo "$VERSION" | cut -d. -f1)
            MINOR=$(echo "$VERSION" | cut -d. -f2)
            PATCH=$(echo "$VERSION" | cut -d. -f3)
            PATCH=$((PATCH + 1))
            NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
          fi
          echo "new_tag=$NEW_TAG" >> "$GITHUB_OUTPUT"
          echo "Next version: $NEW_TAG"

      - name: Tag this repo and propagate to all siblings
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          NEW_TAG="${{ steps.version.outputs.new_tag }}"
          OWNER="matheus-marques-ft"
          REPOS="js-jumpserver js-sdk-go js-koko js-lion js-luna js-lina js-chen js-docker-web js-installer js-client"
          THIS_REPO="$(basename "${{ github.repository }}")"

          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git tag "${NEW_TAG}"
          git push origin "${NEW_TAG}"

          for repo in ${REPOS}; do
            [ "${repo}" = "${THIS_REPO}" ] && continue
            SHA=$(gh api "repos/${OWNER}/${repo}/git/refs/heads/dev" --jq '.object.sha')
            gh api -X POST "repos/${OWNER}/${repo}/git/refs" \
              -f ref="refs/tags/${NEW_TAG}" -f sha="${SHA}" \
              && echo "  ${repo} -> ${NEW_TAG}" \
              || echo "  WARNING: could not tag ${repo} with ${NEW_TAG}"
          done


  image:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          push: true
          build-args: VERSION=${{ inputs.tag }}
          tags: ghcr.io/matheus-marques-ft/luna:${{ inputs.tag }}

      - name: Trigger docker-web build
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          gh workflow run release.yml -R matheus-marques-ft/js-docker-web --ref dev -f tag=${{ inputs.tag }}
