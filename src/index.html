<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta content="0" http-equiv="Expires">
  <meta content="no-cache" http-equiv="Pragma">
  <meta content="no-cache" http-equiv="Cache-control">
  <meta content="no-cache" http-equiv="Cache">
  <title></title>
  <base href="/luna/">
  <script>
    /**
     * Core logic of the multi-subdirectory scheme (kept as a fallback):
     * 1. Dynamically compute the prefix (Site Prefix).
     * 2. Use document.write to synchronously write the <base> tag.
     * This ensures the base path is already in effect before the browser parses
     * subsequent link/script tags, avoiding the pre-parser issuing incorrect
     * requests without the prefix.
     */
    (function () {
      var pathname = window.location.pathname || '/';
      var marker = '/luna/';
      var idx = pathname.indexOf(marker);
      var prefix = '';

      // Handle path matching
      if (idx === -1 && /\/luna$/.test(pathname)) {
        idx = pathname.length - '/luna'.length;
      }

      if (idx > 0) {
        prefix = pathname.slice(0, idx);
      }

      prefix = prefix.replace(/\/+$/, '');

      // Set global variables for use by application code
      window.__BASE_PATH__ = prefix;
      window.__UI_BASE__ = prefix + '/ui/';
      window.__LUNA_BASE__ = prefix + marker;

      // dev scheme (currently active): dynamically set the href of the existing <base> tag
      var baseElement = document.querySelector('base');
      if (baseElement) {
        baseElement.setAttribute('href', window.__LUNA_BASE__);
      }
      // Multi-subdirectory scheme (kept as a fallback): synchronously write the base tag to prevent the browser from preloading ahead of time
      // document.write('<base href="' + window.__LUNA_BASE__ + '">');
    })();
  </script>

  <meta content="width=device-width, initial-scale=1" name="viewport">
  <link href="favicon.ico" rel="icon" type="image/x-icon">
  <style>
    :root {
      --primary-color: #1ab394
    }
    #loading {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: white;
      z-index: 9999;
    }

    .spinner {
      width: 50px;
      height: 50px;
      border: 5px solid rgba(0, 0, 0, 0.1);
      border-radius: 50%;
      border-top-color: #3498db;
      animation: spin 1s infinite linear;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>
<body>
<app-root>
  <div id="loading">
    <div class="spinner"></div>
  </div>
</app-root>
<span id="marker" style="display: none;font-size: 14px">marker</span>

<script>
  if (navigator.keyboard && navigator.keyboard.lock) {
    navigator.keyboard.lock(['Escape']);
  } else {
    console.log('Browser does not support the ESC long-press-to-exit feature')
  }
  window.onload = async function (ev) {
    let clipboardData = "";

    if (!document.hasFocus()) return

    try {
      // Read clipboard content
      if (navigator.clipboard && navigator.clipboard.readText) {
        clipboardData = await navigator.clipboard.readText()
      }

      // Write the content back
      if (navigator.clipboard && navigator.clipboard.writeText) {
        await navigator.clipboard.writeText(clipboardData);
      }
    } catch (e) {
      console.info(e)
    }
  }
</script>
</body>
</html>
